[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcs-mdp"
version = "0.1.0"
description = "SFCS manufacturing digital thread traveler runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.7.4",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "ruff==0.5.6",
    "mypy==1.11.1",
]

[project.scripts]
sfcs-mdp = "sfcs_mdp.cli:main"
repo-lint = "sfcs_mdp.linting:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
