[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfcs-mdp"
version = "0.1.0"
description = "SFCS manufacturing digital thread traveler runner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "bojnick-source"}]
keywords = ["sfcs", "manufacturing", "digital-thread", "drone", "computational-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7.4,<3",
    "PyYAML>=6.0.2,<7",
]

[project.urls]
Repository = "https://github.com/bojnick-source/DARK_leaf_drone_4-1_V2"
Issues = "https://github.com/bojnick-source/DARK_leaf_drone_4-1_V2/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "ruff==0.5.6",
    "mypy==1.11.1",
]
exe = [
    "pyinstaller>=6.12",
]

[project.scripts]
sfcs-mdp = "sfcs_mdp.cli:main"
repo-lint = "sfcs_mdp.linting:main"

[tool.setuptools]
package-dir = {"" = "src", "v2.python" = "v2/python"}

[tool.setuptools.packages.find]
where = ["src", "v2/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sfcs_mdp", "reidce", "v2"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
mypy_path = "src:v2/python"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
