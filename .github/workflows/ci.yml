name: ci

on:
  push:
    branches: [ main, copilot/implement-computational-engineering-system ]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        enable_v2: [ "OFF", "ON" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.enable_v2 }} -DENABLE_V2_ENGINE=${{ matrix.enable_v2 }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build build-${{ matrix.enable_v2 }}

      - name: Verify compile_commands isolation
        run: |
          python python/tools/v2/verify_compile_db_isolation.py \
            --compile-db build-${{ matrix.enable_v2 }}/compile_commands.json \
            ${{ matrix.enable_v2 == 'OFF' && '--require-absent v2/engine --require-absent cpp/engine/analysis --require-absent v2/studio' || '--require-present v2/engine --require-present cpp/engine/analysis' }}

      - name: Test
        run: |
          ctest --test-dir build-${{ matrix.enable_v2 }}
