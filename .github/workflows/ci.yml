name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: Validate mathlib
        run: python3 tools/validate_mathlib_v0.py manufacturing/mathlib_v0.yaml

  cpp:
    strategy:
      fail-fast: false
      matrix:
        enable_v2: [ "OFF", "ON" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.enable_v2 }} -DENABLE_V2_ENGINE=${{ matrix.enable_v2 }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build build-${{ matrix.enable_v2 }}

      - name: Verify compile_commands isolation
        run: |
          python python/tools/v2/verify_compile_db_isolation.py \
            --compile-db build-${{ matrix.enable_v2 }}/compile_commands.json \
            ${{ matrix.enable_v2 == 'OFF' && '--require-absent v2/engine --require-absent cpp/engine/analysis --require-absent v2/studio' || '--require-present v2/engine --require-present cpp/engine/analysis' }}

      - name: Determinism test listing
        run: |
          ctest --test-dir build-${{ matrix.enable_v2 }} -N -L determinism

      - name: Determinism run-twice tripwire
        if: matrix.enable_v2 == 'ON'
        run: |
          ctest --test-dir build-${{ matrix.enable_v2 }} -L determinism --output-on-failure
          ctest --test-dir build-${{ matrix.enable_v2 }} -L determinism --output-on-failure

      - name: Test
        run: |
          ctest --test-dir build-${{ matrix.enable_v2 }}
