<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK_leaf_drone — Dashboard Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Tahoma, Geneva, Verdana, sans-serif;
      --menu-h: 64px;
      --task-h: 64px;
      --accent: #38f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0f14;
      color: #f4f7ff;
    }
    header, footer {
      position: fixed;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: rgba(16, 20, 30, 0.92);
      border-bottom: 1px solid rgba(120, 150, 220, 0.25);
      z-index: 10;
    }
    header { top: 0; min-height: var(--menu-h); }
    footer { bottom: 0; min-height: var(--task-h); border-top: 1px solid rgba(120, 150, 220, 0.25); }
    main {
      padding: calc(var(--menu-h) + 16px) 16px calc(var(--task-h) + 16px);
    }
    .menu { display: flex; gap: 8px; flex-wrap: wrap; }
    .menu button {
      background: rgba(56, 243, 255, 0.2);
      border: 1px solid rgba(56, 243, 255, 0.4);
      color: #f4f7ff;
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .menu button.active { color: var(--accent); }
    .panel {
      padding: 16px;
      border-radius: 16px;
      background: rgba(24, 30, 42, 0.85);
      border: 1px solid rgba(120, 150, 220, 0.35);
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .pill {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(120, 150, 220, 0.35);
      background: rgba(20, 26, 38, 0.8);
      font-size: 12px;
      text-transform: uppercase;
    }
    footer .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <div class="menu">
      <button class="active">CAD</button>
      <button>SIM</button>
      <button>INSIGHTS</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <strong>Preview Shell</strong>
      <p>This standalone file always renders menu + task bars with a visible content panel.</p>
    </div>
    <div class="grid" style="margin-top: 16px;">
      <div class="panel">Left Panel</div>
      <div class="panel">Center Panel</div>
      <div class="panel">Right Panel</div>
    </div>
  </main>

  <footer>
    <div class="bar">
      <span class="pill">MODE: CAD</span>
      <span class="pill">STATUS: READY</span>
    </div>
  </footer>
</body>
</html>
