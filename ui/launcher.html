<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARK Leaf — Obsidian CAD Studio</title>
  <link rel="stylesheet" href="./launcher.css" />
</head>
<body>
  <div class="cad-shell">
    <aside class="rail rail-left glass">
      <button class="rail-btn active" data-view="cad">Modeling</button>
      <button class="rail-btn" data-view="analytics">Visualization</button>
      <button class="rail-btn" data-view="sim">Simulation</button>
      <div class="rail-sep"></div>
      <button class="rail-btn">Sketch</button>
      <button class="rail-btn">Add</button>
      <button class="rail-btn">Transform</button>
      <button class="rail-btn">Tools</button>
      <div class="rail-grow"></div>
      <button class="rail-btn">Measure</button>
    </aside>

    <main class="workspace">
      <header class="topbar glass">
        <div class="project-pill">🏠 Untitled Project · Drone CAD</div>
        <div class="top-actions">
          <button class="action-btn" id="btnShaded">Shaded</button>
          <button class="action-btn" id="btnWire">Wire</button>
          <button class="action-btn" id="btnXray">X-Ray</button>
        </div>
      </header>

      <section id="view-cad" class="view active">
        <section class="viewport-wrap glass">
          <canvas id="cadCanvas"></canvas>
          <div class="hud hud-right glass">
            <div class="hud-title">Display Modes</div>
            <div class="hud-row" id="modeRow">Shaded</div>
            <div class="hud-row" id="triRow">Triangles: --</div>
            <div class="hud-row" id="vertRow">Vertices: --</div>
          </div>
          <div class="hud hud-bottom glass">
            <span class="badge">Detailed CAD assembly</span>
            <span class="badge">Parametric quad drone</span>
            <span class="badge">Noir Obsidian Glass</span>
          </div>
        </section>
      </section>

      <section id="view-analytics" class="view">
        <div class="grid2">
          <div class="card glass">
            <h2>Comparative Graph</h2>
            <canvas id="compareCanvas" width="560" height="300"></canvas>
          </div>
          <div class="card glass">
            <h2>Coefficient Impact</h2>
            <canvas id="coeffCanvas" width="560" height="300"></canvas>
          </div>
        </div>
      </section>

      <section id="view-sim" class="view">
        <div class="card glass">
          <h2>Integrated Flight Signal</h2>
          <canvas id="simCanvas" width="1200" height="320"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="./lib/three.min.js"></script>
  <script src="./launcher.js"></script>
  <script src="./desktop_only.js"></script>
</body>
</html>
