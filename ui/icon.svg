<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Drone body -->
  <ellipse cx="64" cy="64" rx="18" ry="8" fill="url(#accent)" opacity="0.9"/>
  <!-- Arms -->
  <line x1="46" y1="56" x2="28" y2="38" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="56" x2="100" y2="38" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="72" x2="28" y2="90" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="72" x2="100" y2="90" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <!-- Rotors -->
  <circle cx="28" cy="38" r="12" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="38" r="12" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="28" cy="90" r="12" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="90" r="12" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <!-- Rotor centers -->
  <circle cx="28" cy="38" r="3" fill="#00d4ff"/>
  <circle cx="100" cy="38" r="3" fill="#00d4ff"/>
  <circle cx="28" cy="90" r="3" fill="#a855f7"/>
  <circle cx="100" cy="90" r="3" fill="#a855f7"/>
  <!-- Label -->
  <text x="64" y="118" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#58a6ff">DARK leaf</text>
</svg>
